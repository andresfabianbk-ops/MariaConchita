<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mariaconchita - Cocina</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

    <div class="app-admin app-shell app-cocina">

    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay-sidebar"></div>

    <div class="contenido">
      <header class="topbar">
        <div class="topbar__titulos">
          <button class="btn-menu-movil" data-accion="toggle-sidebar" aria-label="Abrir menú" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="topbar__titulo">Cocina</h1>
            <p class="topbar__subtitulo">Pedidos en cola</p>
          </div>
        </div>
      </header>

      <main class="principal">
  <div class="cocina-container">

  <main class="cocina-container">
    <h1>Pedidos en cola</h1>
    <div id="aviso-conexion-cocina" class="aviso-conexion-cocina" style="display: none;">
      <span>Conexión perdida con el servidor.</span>
      <button type="button" id="btn-reintentar-cocina">Reintentar</button>
    </div>
    <div id="lista-cocina" class="lista-cocina">
      <!-- Se llena dinámicamente con cocina.js -->
    </div>
    </div>
      </main>
    </div>
  </div>

  <!-- Aviso bloqueante de pedidos cancelados (se muestra desde cocina.js) -->
  <div id="modal-cancelaciones" class="modal-cancelaciones" style="display: none;" role="alertdialog" aria-modal="true" aria-labelledby="titulo-cancelaciones">
    <div class="modal-cancelaciones__caja">
      <h2 id="titulo-cancelaciones">Pedidos cancelados</h2>
      <p>Estos pedidos fueron cancelados. Confirma que los viste para continuar.</p>
      <ul id="lista-cancelaciones" class="lista-cancelaciones">
        <!-- Se llena dinámicamente con cocina.js -->
      </ul>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/menu-lateral.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/cocina.js"></script>
</body>
</html>
