<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario — Panel de Administrador MariaConchita</title>
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
  <div class="app-admin app-shell">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="overlay-sidebar"></div>

    <!-- ===== CONTENIDO ===== -->
    <div class="contenido">
      <header class="topbar">
        <div class="topbar__titulos">
          <button class="btn-menu-movil" data-accion="toggle-sidebar" aria-label="Abrir o colapsar menú" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="topbar__titulo">Inventario</h1>
            <p class="topbar__subtitulo">Stock de insumos según receta de cada producto</p>
          </div>
        </div>
        <div class="topbar__usuario">
          <div class="avatar">AC</div>
        </div>
      </header>

            <main class="principal">

        <!-- Alerta de stock bajo: inventario.js la muestra y la llena si hay insumos Agotado o Bajo -->
        <div class="alerta-banner" id="alerta-stock" role="status" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div>
            <div class="alerta-banner__titulo">Alerta de stock bajo</div>
            <div class="alerta-banner__texto" id="alerta-stock-texto"></div>
          </div>
        </div>

        <div class="barra-herramientas">
          <div class="barra-herramientas__filtros">
            <div class="campo-busqueda">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="search" id="filtro-busqueda-insumo" placeholder="Buscar insumo...">
            </div>
            <select class="select-filtro" id="filtro-unidad-insumo" aria-label="Filtrar por unidad de medida">
              <option value="">Unidad: todas</option>
              <option value="g">Gramos (g)</option>
              <option value="ml">Mililitros (ml)</option>
              <option value="litro">Litros</option>
              <option value="unidad">Unidad</option>
            </select>
            <select class="select-filtro" id="filtro-nivel-insumo" aria-label="Filtrar por estado de stock">
              <option value="">Estado: todos</option>
              <option value="Agotado">Agotado</option>
              <option value="Bajo">Stock bajo</option>
              <option value="Normal">Stock normal</option>
            </select>
          </div>
          <div style="display: flex; gap: var(--esp-3);">
            <button class="btn btn-secundario" data-abrir-modal="modal-insumo">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Nuevo insumo
            </button>
            <button class="btn btn-primario" data-abrir-modal="modal-movimiento">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Registrar movimiento
            </button>
          </div>
        </div>

        <div class="tarjeta" id="panel-insumos">
          <div class="estado-vacio" id="estado-vacio-insumos" style="display: none;">
            <div class="estado-vacio__icono">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
            </div>
            <h2 class="estado-vacio__titulo">Sin insumos para mostrar con estos filtros</h2>
            <p class="estado-vacio__texto">Cambia los filtros o crea un insumo nuevo.</p>
          </div>

          <div class="tabla-envoltorio">
            <table class="tabla">
              <thead>
                <tr>
                  <th>Insumo</th>
                  <th>Unidad</th>
                  <th>Stock actual</th>
                  <th>Stock mínimo</th>
                  <th>Nivel</th>
                  <th>Estado</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tabla-insumos"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  

    <!-- ===== MODAL: REGISTRAR MOVIMIENTO DE INVENTARIO ===== -->
  <div class="fondo-modal" id="modal-movimiento">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-movimiento">
      <div class="modal__encabezado">
        <h2 class="modal__titulo" id="titulo-modal-movimiento">Registrar movimiento de inventario</h2>
        <button type="button" class="btn-icono" data-cerrar-modal aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="form-movimiento" novalidate>
        <div class="modal__cuerpo">
          <div class="form-grid">
            <div class="campo campo--ancho-completo">
              <label for="mov-insumo">Insumo</label>
              <select id="mov-insumo"></select>
            </div>
            <div class="campo">
              <label for="mov-tipo">Tipo de movimiento</label>
              <select id="mov-tipo">
                <option value="Entrada">Entrada</option>
                <option value="Salida por merma">Merma</option>
              </select>
            </div>
            <div class="campo">
              <label for="mov-cantidad">Cantidad</label>
              <input type="number" id="mov-cantidad" placeholder="0" min="0" step="0.001">
            </div>
            <div class="campo campo--ancho-completo">
              <label for="mov-motivo">Motivo <span class="ayuda">(obligatorio en merma)</span></label>
              <textarea id="mov-motivo" maxlength="150" placeholder="Ej. Compra a proveedor, producto vencido..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal__pie">
          <button type="button" class="btn btn-secundario" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-primario">Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL: CREAR / EDITAR INSUMO ===== -->
  <div class="fondo-modal" id="modal-insumo">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-insumo">
      <div class="modal__encabezado">
        <h2 class="modal__titulo" id="titulo-modal-insumo">Nuevo insumo</h2>
        <button type="button" class="btn-icono" data-cerrar-modal aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="form-insumo" novalidate>
        <div class="modal__cuerpo">
          <div class="form-grid">
            <div class="campo campo--ancho-completo">
              <label for="ins-nombre">Nombre</label>
              <input type="text" id="ins-nombre" maxlength="100" placeholder="Ej. Queso mozarella">
            </div>
            <div class="campo">
              <label for="ins-unidad">Unidad de medida</label>
              <select id="ins-unidad">
                <option value="g">Gramos (g)</option>
                <option value="ml">Mililitros (ml)</option>
                <option value="litro">Litros</option>
                <option value="unidad">Unidad</option>
              </select>
            </div>
            <div class="campo">
              <label for="ins-minimo">Stock mínimo</label>
              <input type="number" id="ins-minimo" placeholder="0" min="0" step="0.001">
            </div>
            <div class="campo campo--ancho-completo">
              <label for="ins-costo">Costo unitario <span class="ayuda">(opcional)</span></label>
              <input type="number" id="ins-costo" placeholder="0" min="0" step="0.01">
            </div>
          </div>
        </div>
        <div class="modal__pie">
          <button type="button" class="btn btn-secundario" data-cerrar-modal>Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/sesion.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/menu-lateral.js"></script>
  <script src="../../js/inventario.js"></script>
  <script src="../../js/admin.js"></script>
</body>
</html>
